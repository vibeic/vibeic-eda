# The fork-only rule, enforced on every change rather than at review time.
#
# Owner rule (2026-07-29): every OSS tool we use is forked into `vibeic/` and
# tracked by the daily fork-gatekeeper; the image consumes our forks and nothing
# else. Before this workflow the rule was checkable only by reading a 605-line
# Dockerfile — it held for exactly as long as everyone editing that file
# remembered it.
#
# This runs in seconds and needs no build, so there is no reason for it to be
# anything but required.#
# WHERE THIS ACTUALLY RUNS TODAY. Measured 2026-07-29: `actions/runs` on this
# repo reports total_count 0 — no workflow has ever executed here, including the
# pre-existing image-version-sync, while `actions/permissions` reports enabled.
# So this file is registered and does not fire, and a rule enforced only here
# would be enforced nowhere. The 05:30 fork-gatekeeper tick runs the same
# checks against the checked-out repo, which is what enforces the rule until
# Actions runs. This workflow is correct and stays; it starts protecting PRs the
# day Actions is turned on, and needs no change then.
name: fork-only

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every source and artefact must be ours
        run: python3 tools/check_fork_only.py

      - name: A tool's commit must say the same thing in all three places
        run: python3 tools/check_pins_agree.py

      # Offline on purpose. The README's two GitHub rows need a token this job
      # does not need for anything else, and they report as UNVERIFIED here
      # rather than passing; the 05:30 tick runs the same checker with --online.
      - name: Every count in the README must still reproduce
        run: python3 tools/check_doc_counts.py

      # A checker that examined nothing exits 2 and says so. Asserting the
      # negative case here means a future refactor that renames Dockerfiles out
      # from under the patterns fails loudly instead of passing silently.
      - name: The checker itself must be able to fail
        run: |
          set +e
          printf 'FROM scratch\nCOPY --from=docker.io/x/y:1 /a /a\n' > /tmp/violation.Dockerfile
          python3 tools/check_fork_only.py /tmp/violation.Dockerfile
          rc=$?
          set -e
          if [ "$rc" != "1" ]; then
            echo "check_fork_only returned $rc on a deliberate violation; it should be 1." >&2
            echo "A guard that cannot fail is not a guard." >&2
            exit 1
          fi
          echo "guard rejects a known violation as expected"

      # Same reasoning for the other three guards. Each asserts the SPECIFIC
      # failure it exists to catch, not merely "some non-zero exit" — a check
      # that fails for the wrong reason still reports green on the right one.
      - name: Each guard must reject the case it exists for
        run: |
          set -e
          fail() { echo "$1" >&2; exit 1; }
          probe() {   # probe <expected-rc> <needle> <file-content>
            printf "$3" > /tmp/p.Dockerfile
            set +e; out=$(python3 tools/check_fork_only.py /tmp/p.Dockerfile 2>&1); rc=$?; set -e
            [ "$rc" = "$1" ] || fail "expected rc=$1, got $rc for: $3"
            echo "$out" | grep -q "$2" || fail "expected message matching '$2'; got: $out"
            echo "  ok: $2"
          }
          # A stage built on someone else's image, copied out of.
          probe 1 "not one of our artefacts" \
            'FROM someoneelse/base AS b\nFROM alpine\nCOPY --from=b /a /a\n'
          # A named build context: resolves outside the file, so unreviewable.
          probe 1 "cannot be checked" \
            'FROM alpine\nCOPY --from=some-context /a /a\n'
          # An ARG default pointing upstream is what a no-build-arg build uses.
          probe 1 "the default is the real source" \
            'ARG R=https://github.com/upstream/thing.git\nFROM alpine\n'

          # A reference pinned by DIGEST must be accepted, for the base and for
          # our own artefacts alike. Both allow-patterns ended in `(:.*)?`, which
          # matches `name:tag` and NOT `name@sha256:…`; the base moved to a digest
          # in 0.2.36 and check_fork_only went red on main, calling the image the
          # composing stage itself uses "not one of our artefacts". A guard that
          # fires because the repository got STRICTER is the kind that gets
          # switched off, so the accept side is pinned here and not only the
          # reject side.
          #
          # EVERY ALLOW PROBE CARRIES A REAL COPY --from. An ALLOWED base does not
          # increment `examined`, so a probe whose Dockerfile holds nothing else
          # exits 2 ("nothing was examined") — which is not a pass and does not
          # prove the base was accepted. Drop the COPY line and these probes go on
          # reporting green while asserting nothing.
          probe 0 "reference" \
            'ARG B=hpretl/iic-osic-tools@sha256:7371bae5\nFROM ${B} AS s\nCOPY --from=ghcr.io/vibeic/eda-tool-yosys:abc /a /a\n'
          probe 0 "reference" \
            'FROM hpretl/iic-osic-tools:latest AS s\nCOPY --from=ghcr.io/vibeic/eda-tool-yosys:abc /a /a\n'
          probe 0 "reference" \
            'FROM alpine\nCOPY --from=ghcr.io/vibeic/eda-tool-yosys@sha256:dead /a /a\n'

          # The power that widening must NOT cost. `([:@].*)?` accepts anything
          # after the separator, so what bounds it is the anchoring — `^`, a
          # literal prefix, and a name class with no `/` — not the suffix. Each
          # of these differs from an allowed reference only in ways the anchoring
          # is supposed to catch, and each must still be rejected.
          probe 1 "not one of our artefacts" \
            'FROM hpretl/iic-osic-tools-evil@sha256:dead AS s\nCOPY --from=s /a /a\n'
          probe 1 "not one of our artefacts" \
            'FROM evil.io/hpretl/iic-osic-tools@sha256:dead AS s\nCOPY --from=s /a /a\n'
          probe 1 "not one of our artefacts" \
            'FROM hpretl/iic-osic-tools/evil@sha256:dead AS s\nCOPY --from=s /a /a\n'
          probe 1 "was not built by us" \
            'FROM alpine\nCOPY --from=ghcr.io/evil/eda-tool-yosys@sha256:dead /a /a\n'
          probe 1 "was not built by us" \
            'FROM alpine\nCOPY --from=ghcr.io/vibeic/eda-tool-yosys/evil@sha256:dead /a /a\n'
          probe 1 "was not built by us" \
            'FROM alpine\nCOPY --from=ghcr.io/vibeic/eda-toolkit@sha256:dead /a /a\n'

          # An EXPIRED exception must fail. PENDING_FORKS.json's whole value is
          # the deadline; if an expired entry still passed, the file would be a
          # permanent allowlist wearing a date.
          #
          # The probe SYNTHESISES its own entry against its own throwaway
          # Dockerfile. It used to re-date the real file's entries and check the
          # real sat-solvers Dockerfile, which quietly stopped testing anything
          # the day that list was emptied and every source became ours: there was
          # no exception left to expire, so check_fork_only correctly returned 0
          # and the probe failed while nothing was wrong. A guard that depends on
          # production data having a particular shape is not a guard — it is a
          # second copy of that data, and it goes stale the same way.
          cp tools/PENDING_FORKS.json /tmp/pf.bak
          printf 'ARG R=https://github.com/upstream/thing.git\nFROM alpine\n' > /tmp/exp.Dockerfile
          pending() {   # pending <expiry> -> write a PENDING_FORKS.json with one entry
            python3 - "$1" <<'EOF'
          import json, pathlib, sys
          pathlib.Path("tools/PENDING_FORKS.json").write_text(json.dumps({"pending": [
              {"source": "upstream/thing", "used_by": "a probe, not the build",
               "reason": "synthesised by the fork-only workflow", "expires": sys.argv[1]}]}, indent=2))
          EOF
          }
          # Positive control FIRST. Without it, a check_fork_only that ignored
          # PENDING_FORKS entirely would fail the expired case for the wrong
          # reason and still look correct here.
          pending 2999-01-01
          set +e; out=$(python3 tools/check_fork_only.py /tmp/exp.Dockerfile 2>&1); rc=$?; set -e
          [ "$rc" = "0" ] || fail "an UNexpired exception returned rc=$rc; it must be honoured
          $out"
          echo "$out" | grep -q "pending fork" || fail "an honoured exception was not reported as pending: $out"
          echo "  ok: unexpired exception is honoured, and says so"

          pending 2000-01-01
          set +e; out=$(python3 tools/check_fork_only.py /tmp/exp.Dockerfile 2>&1); rc=$?; set -e
          cp /tmp/pf.bak tools/PENDING_FORKS.json
          [ "$rc" = "1" ] || fail "an expired exception returned rc=$rc; it must fail
          $out"
          echo "$out" | grep -q "EXPIRED" || fail "expiry failure did not name the expiry: $out"
          echo "  ok: expired exception fails"

          # And the file it just restored must be the file it saved.
          cmp -s /tmp/pf.bak tools/PENDING_FORKS.json || fail "the probe did not restore PENDING_FORKS.json"
          echo "  ok: PENDING_FORKS.json restored"

      # check_doc_counts has four ways to be uselessly green, and each is
      # asserted separately. Probes 2 and 3 are the reason it exists at all: the
      # cheapest ways to "fix" a failing count are to delete the command that
      # produced it, or to replace it with one that cannot disagree. Both leave
      # the number in place and unchecked, and both must fail exactly as loudly
      # as a wrong number.
      - name: The README-count guard must reject each way of going stale
        run: |
          python3 - <<'EOF'
          import pathlib, subprocess, sys

          README = pathlib.Path("README.md").read_text()
          TMP = pathlib.Path("/tmp/doc.md")
          failures = []

          def probe(label, expect_rc, needle, doc):
              TMP.write_text(doc)
              p = subprocess.run([sys.executable, "tools/check_doc_counts.py", str(TMP)],
                                 capture_output=True, text=True)
              out = p.stdout + p.stderr
              if p.returncode != expect_rc:
                  failures.append(f"{label}: expected rc={expect_rc}, got {p.returncode}\n{out}")
              elif needle not in out:
                  failures.append(f"{label}: expected a message containing {needle!r}\n{out}")
              else:
                  print(f"  ok: {label}")

          def mutate(old, new):
              # A probe that silently matched nothing would assert nothing, and
              # would keep reporting ok after the README was rewritten past it.
              assert README.count(old) == 1, f"probe target is not unique: {old!r}"
              return README.replace(old, new)

          # 1. A count that no longer matches what the repository says.
          probe("wrong number", 1, "the repository says", mutate("| **8** |", "| **9** |"))

          # 2. A count whose command was deleted. The claim survives, the binding
          #    does not — and deleting the command is the cheapest way to "fix" a
          #    red build, so it must fail exactly as loudly as a wrong number.
          probe("command deleted, claim kept", 1, "no longer parses",
                mutate("`ls tools/*/Dockerfile \\| wc -l`", "(obvious)"))

          # 3. A command that cannot fail. Swapping the command for `echo 8`
          #    keeps every row green forever and measures nothing — the original
          #    defect, reintroduced through the mechanism built to prevent it.
          probe("constant instead of a measurement", 1, "names nothing in this repository",
                mutate("| per-tool build artefacts (`tools/<name>/`) | **8** | `ls tools/*/Dockerfile \\| wc -l` |",
                       "| per-tool build artefacts | **8** | `echo 8` |"))

          # 4. A document with no fences compared nothing, which is not a pass.
          probe("nothing to compare", 2, "nothing was compared", "# no counts here\n")

          if failures:
              print("\nA guard that cannot fail is not a guard:", file=sys.stderr)
              for f in failures:
                  print(f"  {f}", file=sys.stderr)
              sys.exit(1)
          EOF
